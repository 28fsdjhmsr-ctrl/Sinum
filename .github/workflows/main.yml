name: Sinum Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS dylib (Strict ARM64 & Signed)
        run: |
          cd ./iOS
          mkdir -p build
          
          # 1. Компилируем строго под ARM64 с указанием внутреннего пути загрузки
          xcrun -sdk macosx clang++ Main.m -dynamiclib \
            -arch arm64 \
            -install_name "@loader_path/libSinum_macos_arm64.dylib" \
            -o build/libSinum_macos_arm64.dylib \
            -framework Foundation

          # 2. Принудительно подписываем библиотеку специальной ad-hoc подписью
          # Без этого шага современные macOS выдают ошибку запуска приложения
          codesign --force --sign - build/libSinum_macos_arm64.dylib

      - name: Upload ARM64 dylib
        uses: actions/upload-artifact@v4
        with:
          name: libSinum-macos-arm64
          path: iOS/build/libSinum_macos_arm64.dylib
